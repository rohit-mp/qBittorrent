<!DOCTYPE html>
<html lang="${LANG}" class="dark">

<head>
    <meta charset="UTF-8">
    <title>QBT_TR(Speed limit)QBT_TR[CONTEXT=SpeedLimit]</title>
    <link rel="stylesheet" href="css/style.css?v=${CACHEID}" type="text/css">
    <script defer src="scripts/localpreferences.js?v=${CACHEID}"></script>
    <script defer src="scripts/color-scheme.js?v=${CACHEID}"></script>
    <script defer src="scripts/misc.js?locale=${LANG}&v=${CACHEID}"></script>
    <script>
        "use strict";

        window.addEventListener("DOMContentLoaded", (event) => {
            const applyButton = document.getElementById("applyButton");

            window.addEventListener("keydown", (event) => {
                switch (event.key) {
                    case "Enter":
                        event.preventDefault();
                        applyButton.click();
                        break;
                    case "Escape":
                        event.preventDefault();
                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                        break;
                }
            });

            const params = new URLSearchParams(window.location.search);
            const type = params.get("type");
            const hashes = params.get("hashes").split("|");

            // Otherwise it's download limit
            const isUpload = (type === "upload");

            const getLimitMethod = isUpload ? "uploadLimit" : "downloadLimit";
            const setLimitMethod = isUpload ? "setUploadLimit" : "setDownloadLimit";

            const limitUpdateValue = document.getElementById("limitUpdateValue");
            const limitUnit = document.getElementById("limitUnit");
            const speedSettings = window.qBittorrent.Misc.getSpeedSettings(window.parent.qBittorrent.Cache.preferences.get());
            limitUnit.textContent = window.qBittorrent.Misc.getSpeedInputUnit(speedSettings);
            let limitValue = 0;
            let limitValueDirty = false;

            const setLimitUpdateValue = (value) => {
                limitValue = value;
                limitValueDirty = false;
                if (value === 0) {
                    limitUpdateValue.value = "∞";
                    limitUnit.style.visibility = "hidden";
                }
                else {
                    limitUpdateValue.value = window.qBittorrent.Misc.speedToInputValue(value, speedSettings);
                    limitUnit.style.visibility = "visible";
                }
            };

            const setupSlider = (limit, maximum) => {
                const input = document.getElementById("limitSliderInput");
                const fallbackMaximum = (1000 * 1024);
                input.max = window.qBittorrent.Misc.speedToInputValue(
                    Math.max(limit, (maximum > 0) ? maximum : fallbackMaximum), speedSettings);
                input.value = window.qBittorrent.Misc.speedToInputValue(limit, speedSettings);
                input.addEventListener("input", (event) => {
                    setLimitUpdateValue(window.qBittorrent.Misc.inputValueToSpeed(event.target.value, speedSettings));
                });
                // Set default value
                setLimitUpdateValue(limit);
            };

            limitUpdateValue.addEventListener("input", () => {
                limitValueDirty = true;
            });

            applyButton.addEventListener("click", (event) => {
                const limit = limitValueDirty
                    ? (window.qBittorrent.Misc.inputValueToSpeed(limitUpdateValue.value, speedSettings) || 0)
                    : limitValue;
                setLimitUpdateValue(limit);

                fetch(`api/v2/torrents/${setLimitMethod}`, {
                        method: "POST",
                        body: new URLSearchParams({
                            hashes: hashes.join("|"),
                            limit: limit
                        })
                    })
                    .then((response) => {
                        if (!response.ok)
                            return;

                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                    });
            });

            document.getElementById("limitUpdateLabel").textContent =
                isUpload
                ? "QBT_TR(Upload limit:)QBT_TR[CONTEXT=SpeedLimit]"
                : "QBT_TR(Download limit:)QBT_TR[CONTEXT=SpeedLimit]";

            fetch(`api/v2/transfer/${getLimitMethod}`, {
                    method: "GET",
                    cache: "no-store"
                })
                .then(async (response) => {
                    if (!response.ok)
                        return;

                    const data = await response.text();

                    const globalLimit = Math.max(Number(data), 0);

                    // Get torrents download limit
                    // And create slider
                    fetch(`api/v2/torrents/${getLimitMethod}`, {
                            method: "POST",
                            body: new URLSearchParams({
                                hashes: hashes.join("|")
                            })
                        })
                        .then(async (response) => {
                            if (!response.ok)
                                return;

                            const data = await response.json();

                            const firstLimit = Math.max(data[hashes[0]], 0);
                            const isAllFirstLimit = Object.values(data).every(value => value === firstLimit);
                            const limit = isAllFirstLimit ? firstLimit : 0;

                            setupSlider(limit, globalLimit);
                        });
                });

            limitUpdateValue.focus();
        });
    </script>
</head>

<body>
    <div style="padding-top: 10px; width: 100%; text-align: center; margin: 0 auto; overflow: hidden">
        <div class="slider">
            <div class="update">
                <label id="limitUpdateLabel" for="limitUpdateValue">QBT_TR(Limit:)QBT_TR[CONTEXT=SpeedLimit]</label>
                <input type="text" id="limitUpdateValue" size="6" placeholder="∞" style="text-align: center;">
                <span id="limitUnit">QBT_TR(KiB/s)QBT_TR[CONTEXT=SpeedLimit]</span>
            </div>
            <input type="range" id="limitSliderInput" min="0" value="0" step="any" style="width: 100%;" aria-label="QBT_TR(Speed limit)QBT_TR[CONTEXT=SpeedLimit]">
        </div>
        <input type="button" id="applyButton" value="QBT_TR(Apply)QBT_TR[CONTEXT=HttpServer]">
    </div>
</body>

</html>
