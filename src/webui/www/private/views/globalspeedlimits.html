<script>
    "use strict";

    window.qBittorrent ??= {};
    window.qBittorrent.GlobalSpeedLimits ??= (() => {
        const exports = () => {
            return {
                init: init,
            };
        };

        const speedInputStates = new WeakMap();

        const setSpeedInputValue = (input, value) => {
            const state = speedInputStates.get(input);
            state.value = value;
            state.dirty = false;

            const displayValue = window.qBittorrent.Misc.speedToInputValue(value, state.settings);
            input.value = (value === 0) ? "∞" : displayValue;
            if (displayValue > state.slider.max)
                state.slider.max = displayValue;
            state.slider.value = displayValue;
        };

        const normalizeSpeedInput = (input, requestedValue = undefined) => {
            const state = speedInputStates.get(input);
            const isStepping = (requestedValue !== undefined);
            if (!isStepping && !state.dirty)
                return state.value;

            const value = isStepping
                ? requestedValue
                : window.qBittorrent.Misc.inputValueToSpeed(input.value, state.settings);
            const currentValue = isStepping ? state.value : undefined;
            const normalizedValue = window.qBittorrent.Misc.normalizeSpeedToKiB(value, currentValue) || 0;
            setSpeedInputValue(input, normalizedValue);
            return normalizedValue;
        };

        const setupSlider = (sliderId, input, limit, settings) => {
            const slider = document.getElementById(sliderId);
            slider.max = window.qBittorrent.Misc.speedToInputValue((10000 * 1024), settings);
            speedInputStates.set(input, {
                dirty: false,
                settings: settings,
                slider: slider,
                value: limit
            });

            input.addEventListener("input", () => {
                speedInputStates.get(input).dirty = true;
            });
            input.addEventListener("change", () => {
                normalizeSpeedInput(input);
            });
            slider.addEventListener("input", (e) => {
                const value = window.qBittorrent.Misc.inputValueToSpeed(e.target.value, settings);
                normalizeSpeedInput(input, value);
            });

            setSpeedInputValue(input, limit);
        };

        const init = () => {
            const speedSettings = window.qBittorrent.Misc.getSpeedSettings();
            const speedUnit = window.qBittorrent.Misc.getSpeedInputUnit(speedSettings);
            const page = document.getElementById("globalSpeedLimitsPage");
            for (const label of page.querySelectorAll(".speedUnitLabel"))
                label.textContent = speedUnit;

            const uploadValue = document.getElementById("uploadValue");
            const downloadValue = document.getElementById("downloadValue");
            const altUploadValue = document.getElementById("altUploadValue");
            const altDownloadValue = document.getElementById("altDownloadValue");

            const applyButton = document.getElementById("applyButton");
            applyButton.disabled = true;
            applyButton.addEventListener("click", () => {
                const upload = normalizeSpeedInput(uploadValue);
                const download = normalizeSpeedInput(downloadValue);
                const altUpload = normalizeSpeedInput(altUploadValue);
                const altDownload = normalizeSpeedInput(altDownloadValue);

                fetch("api/v2/transfer/setSpeedLimits", {
                    method: "POST",
                    body: new URLSearchParams({
                        up_limit: upload,
                        dl_limit: download,
                        alt_up_limit: altUpload,
                        alt_dl_limit: altDownload,
                    })
                }).then((response) => {
                    if (!response.ok)
                        alert("QBT_TR(Failed to set speed limits)QBT_TR[CONTEXT=SpeedLimit]");

                    window.parent.updateMainData();
                    window.parent.qBittorrent.Client.closeWindow(document.getElementById("globalSpeedLimitsPage"));
                });
            });

            fetch("api/v2/transfer/getSpeedLimits", {
                    method: "GET",
                    cache: "no-store"
                })
                .then(async (response) => {
                    const limits = await response.json();
                    setupSlider("uploadSlider", uploadValue, Number(limits.up_limit), speedSettings);
                    setupSlider("downloadSlider", downloadValue, Number(limits.dl_limit), speedSettings);
                    setupSlider("altUploadSlider", altUploadValue, Number(limits.alt_up_limit), speedSettings);
                    setupSlider("altDownloadSlider", altDownloadValue, Number(limits.alt_dl_limit), speedSettings);
                    applyButton.disabled = false;
                });
        };

        return exports();
    })();
    Object.freeze(window.qBittorrent.GlobalSpeedLimits);

    window.qBittorrent.GlobalSpeedLimits.init();
</script>
